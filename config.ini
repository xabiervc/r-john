# R-John Configuration
# This file is optional - game works without it

[game]
# Starting stats (0-100)
starting_reputation = 50
starting_lust = 30
starting_risk = 30

# Display settings
show_stat_changes = true
show_private_thoughts = true
default_mood = Neutral

# Save settings
auto_save = true
max_saves = 10

[debug]
# Enable debug mode
enabled = false
# Skip chapters for testing
skip_to_chapter = 1